name: X 发帖监控

on:
  schedule:
    # 每 8 小时检查一次 (UTC 时间)
    # 免费 API 每月 100 次请求，每天 3 次 ≈ 每月 90 次，留有富余
    # 可根据需要调整频率，但注意不要超过 X API 免费额度
    - cron: "0 */6 * * *"
  workflow_dispatch:  # 允许手动触发
    inputs:
      target:
        description: "目标用户名 (不含 @)"
        required: true
        default: ""
      filter_keywords:
        description: "过滤关键词，逗号分隔 (如: Booster,#币安钱包)"
        required: false
        default: ""

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行监控
        env:
          TWITTERI_API: ${{ secrets.TWITTERI_API }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DEFAULT_FILTER_KEYWORDS: "Booster,#币安钱包"
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then
            TARGET="binancezh"
          fi

          # 构建过滤参数（关键词已用逗号分隔，直接传递）
          FILTER_ARG=""
          MANUAL_FILTER="${{ github.event.inputs.filter_keywords }}"
          if [ -n "$MANUAL_FILTER" ]; then
            FILTER_ARG="--filter $MANUAL_FILTER"
          elif [ -n "$DEFAULT_FILTER_KEYWORDS" ]; then
            FILTER_ARG="--filter $DEFAULT_FILTER_KEYWORDS"
          fi

          python monitor.py --target "$TARGET" $FILTER_ARG

      - name: 提交状态更新
        # 如果有新推文，state.json 会被更新，需要提交回仓库
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "📝 更新监控状态 [skip ci]"
            git push
          fi
